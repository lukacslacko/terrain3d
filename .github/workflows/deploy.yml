name: Deploy to GitHub Pages

on:
  # Manual for now; enable the push trigger once a manual run has deployed.
  # push:
  #  branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't let a newer run cancel a deployment that is already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true

      - name: Install Trunk
        run: cargo install trunk

      - name: Install wasm-opt
        run: cargo install wasm-opt

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Build (WASM)
        run: trunk build --release --public-url /terrain3d/ --filehash false --dist dist

      - name: Optimize WASM
        run: wasm-opt -Oz -o dist/terrain3d_bg.wasm dist/terrain3d_bg.wasm

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
