name: WASM build and deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "index.html"
      - ".cargo/**"
      - ".github/workflows/deploy.yml"
  # Build (but don't deploy) on PRs, to catch a broken web build before merging.
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "index.html"
      - ".cargo/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR builds, but never a deployment in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRUNK_VERSION: v0.21.14
  BINARYEN_VERSION: version_133

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk and wasm-opt
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/$TRUNK_VERSION/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/.local/bin"
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz" \
            | tar xz -C "$HOME/.local/bin" --strip-components=2 "binaryen-$BINARYEN_VERSION/bin/wasm-opt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build (WASM)
        # wasm-opt strips the debug info anyway, so skip building it.
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "false"
        run: trunk build --release --public-url /terrain3d/ --filehash false --dist dist

      - name: Optimize WASM
        run: wasm-opt -Oz -o dist/terrain3d_bg.wasm dist/terrain3d_bg.wasm

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
